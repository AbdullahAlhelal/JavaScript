<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Theme Switcher</title>
    <style>
      /* ═══════════════════════════════════
           🎨 Light Theme (Default)
        ═══════════════════════════════════ */
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f5f5f5;
        --bg-card: #ffffff;
        --text-primary: #1a1a1a;
        --text-secondary: #555555;
        --border-color: #e0e0e0;
        --accent-color: #667eea;
        --accent-hover: #5568d3;
        --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        --shadow-hover: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      /* ═══════════════════════════════════
           🌙 Dark Theme
        ═══════════════════════════════════ */
      [data-theme="dark"] {
        --bg-primary: #1a1a2e;
        --bg-secondary: #16213e;
        --bg-card: #0f3460;
        --text-primary: #ffffff;
        --text-secondary: #b8b8b8;
        --border-color: #2d3561;
        --accent-color: #e94560;
        --accent-hover: #ff6b7d;
        --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 8px 25px rgba(0, 0, 0, 0.5);
      }

      /* ═══════════════════════════════════
           🎯 Using Variables
        ═══════════════════════════════════ */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        padding: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background: var(--bg-secondary);
        border-radius: 10px;
        margin-bottom: 30px;
      }

      .header h1 {
        color: var(--text-primary);
      }

      /* 🔘 Toggle Button */
      .theme-toggle {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow);
      }

      .theme-toggle:hover {
        background: var(--accent-hover);
        transform: scale(1.05);
      }

      /* 🎴 Cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--bg-card);
        padding: 25px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-hover);
      }

      .card h3 {
        color: var(--text-primary);
        margin-bottom: 10px;
      }

      .card p {
        color: var(--text-secondary);
        line-height: 1.6;
      }

      .btn {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
      }

      .btn:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🎨 My Website</h1>
      <button class="theme-toggle" id="themeToggle">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Dark Mode</span>
      </button>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Card 1</h3>
        <p>This is a beautiful card that changes with the theme.</p>
        <button class="btn">Read More</button>
      </div>
      <div class="card">
        <h3>Card 2</h3>
        <p>Try clicking the theme toggle button in the header!</p>
        <button class="btn">Read More</button>
      </div>
      <div class="card">
        <h3>Card 3</h3>
        <p>Your theme choice will be saved automatically.</p>
        <button class="btn">Read More</button>
      </div>
    </div>

    <script>
      // ═══════════════════════════════════
      // 🎨 Theme Manager
      // ═══════════════════════════════════

      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");
      const themeText = document.getElementById("themeText");
      const htmlElement = document.documentElement;

      // 🚀 تحميل الـ Theme المحفوظ عند فتح الصفحة
      function loadTheme() {
        const savedTheme = localStorage.getItem("theme") || "light";
        setTheme(savedTheme);
      }

      // 🎯 تغيير الـ Theme
      function setTheme(theme) {
        htmlElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        // تحديث الأيقونة والنص
        if (theme === "dark") {
          themeIcon.textContent = "☀️";
          themeText.textContent = "Light Mode";
        } else {
          themeIcon.textContent = "🌙";
          themeText.textContent = "Dark Mode";
        }
      }

      // 🔄 التبديل بين الـ Themes
      function toggleTheme() {
        const currentTheme = htmlElement.getAttribute("data-theme") || "light";
        const newTheme = currentTheme === "light" ? "dark" : "light";
        setTheme(newTheme);
      }

      // 🖱️ Event Listener
      themeToggle.addEventListener("click", toggleTheme);

      // ⚡ تحميل الـ Theme عند بدء الصفحة
      loadTheme();
    </script>
  </body>
</html>
